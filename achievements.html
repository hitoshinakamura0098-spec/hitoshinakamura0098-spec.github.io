          <button class="secondary-card" data-title="Microsoft・AWSとの技術連携" data-cat="Technical Coordination" data-detail="AWS環境の構築・障害調査と並行し、Microsoft・AWS双方のサポート窓口との技術連携を担当。ログや検証結果を根拠に調査の論点を示し、自動応答からオペレーター、上位エンジニアへのエスカレーションへつなげ、技術対応を依頼した。"><strong>Microsoft・AWSとの技術連携</strong><span>検証結果を根拠に上位エンジニアへつなぎ、障害対応を前進。</span></button>

          <button class="secondary-card" data-title="テスト要項の設計と実装" data-cat="Test Design / Verification" data-detail="現行の試験要項と過去の結合・シナリオテスト資料を比較し、未反映の試験観点を抽出。正常系に加え、異常系・境界値・権限・入力値・組み合わせ条件まで試験項目を設計し、補足試験要項としてExcelに実装した。既存資料の比較から、実施に使う試験要項への落とし込みまでを担当。"><strong>テスト要項の設計と実装</strong><span>既存テストの抜けを抽出し、異常系・境界値・権限まで試験要項に実装。</span></button>
          <button class="secondary-card" data-title="ソースコード差分調査" data-cat="Source Review / Change Analysis" data-detail="旧版と変更版のC# / Razor / JavaScript / SQLをWinMerge等で比較し、コードの変更点と不具合発生点の関係を追跡。1箇所ずつの再デプロイと実機確認を組み合わせ、変更の影響を層ごとに切り分けた。実際の挙動との照合によって、変更の影響と原因範囲を絞り込んだ。"><strong>ソースコード差分調査</strong><span>コードの変更点と不具合を照合し、再デプロイ・実機検証で原因を絞り込む。</span></button>
          <button class="secondary-card" data-title="SQL・アプリ不具合の切り分け" data-cat="Data / Application" data-detail="メールテンプレートSQLとアプリ側の表示条件を検証。日本語名・英語名の組み合わせ、NULL / 空文字の条件を比較し、SQL側の表示仕様とアプリ変数側の不具合候補を分けて検証した。データ処理と画面表示の両面から、不具合の原因範囲を切り分けた。"><strong>SQL・アプリ不具合の切り分け</strong><span>NULL・空文字・表示条件を検証し、SQLとアプリの原因範囲を分離。</span></button>
          <button class="secondary-card" data-title="開発レビュー・PM補助" data-cat="Review / Project Support" data-detail="外注開発の移植・接続レビューや打合せに参加し、テスト結果から不具合・仕様差異を検証。Planner / Teamsを用いたタスク整理や運用整理も担当し、技術面のレビューと進行管理の補助の両面から開発を支援した。"><strong>開発レビュー・PM補助</strong><span>仕様差異と不具合をレビューし、タスク整理まで開発進行を支援。</span></button>
          <button class="secondary-card" data-title="実機・サーバー間の通信調査" data-cat="HTTP / WebSocket / Logs" data-detail="実機とサーバー間の接続を、HTTP / WebSocketの要求・応答、通信経路、各層のログから追跡。接続のどの段階で差が生じるかを比較し、端末・ネットワーク・アプリの確認範囲を切り分けた。通信条件と残る課題を整理し、設定確認や再検証につなげた。"><strong>実機・サーバー間の通信調査</strong><span>HTTP / WebSocketを追跡し、端末・ネットワーク・サーバーの問題を切り分け。</span></button>
          <button class="secondary-card" data-title="運用手順・技術資料の整備" data-cat="Documentation / Operations" data-detail="API Testerの操作手順書を、操作の前提・実施手順・確認点まで見直して改訂し、提出まで担当。環境構築・運用の手順書、設計資料、課題一覧も整備した。調査や検証で得た知見を資料化し、再確認や引き継ぎに使える形へまとめた。"><strong>運用手順・技術資料の整備</strong><span>API Testerの手順書を改訂・提出。構築と調査の知見を、運用・引き継ぎの資料へ。</span></button>
          <button class="secondary-card" data-title="メール通知・認証構成の調査" data-cat="Mail Architecture / DNS" data-detail="メール送信・バウンス処理・運用通知の役割を整理し、通知経路とDNS認証の構成を調査。SESイベント、SMTP応答、SPF / DKIM / DMARCを照合し、送信処理と監視通知の確認範囲を明確にした。構成上の役割と観測点を、運用設計の判断材料としてまとめた。"><strong>メール通知・認証構成の調査</strong><span>送信・バウンス・運用通知の役割を分け、認証設定と監視の判断材料を整備。</span></button>
          <button class="secondary-card" data-title="高可用性構成の調査・設計検討" data-cat="Architecture / Research" data-detail="高可用性構成の調査・設計検討を担当。Web・アプリ・DB各層の役割と冗長化の考え方を比較し、障害時の影響範囲、切り替え時に確認すべき条件、監視・運用上の論点を整理した。構成の選択と検証に必要な判断材料をまとめた。"><strong>高可用性構成の調査・設計検討</strong><span>Web・アプリ・DBの冗長化を比較し、障害時の影響・切り替え・監視条件を検討。</span></button>
          <button class="secondary-card" data-title="AIを用いた設計・解析・資料化" data-cat="AI Assisted Engineering" data-detail="障害解析、設計補助、資料作成、コード確認にAIを活用。実環境のログ・レスポンス・設定・コードと突き合わせて出力を検証し、技術調査から資料化までの実務に組み込んでいる。"><strong>AIを用いた設計・解析・資料化</strong><span>AIの出力をログ・設定・コードで検証し、障害解析と設計・資料作成に活用。</span></button>
          <button class="secondary-card" data-title="Azure導入・運用設計の企画" data-cat="Planning / Cloud" data-detail="Azureを利用した開発・運用の導入方法を企画。既存環境との役割分担、運用方法、導入候補を整理し、導入・運用設計の検討を進めた。"><strong>Azure導入・運用設計の企画</strong><span>既存環境との役割分担から、導入候補と運用方法を企画。</span></button>

    <script>
    (function(){
      const overlay=document.getElementById('detailModal');
      const name=document.getElementById('detailModalName');
      const cat=document.getElementById('detailModalCat');
      const desc=document.getElementById('detailModalDesc');
      if(!overlay)return;
      function open(el){name.textContent=el.dataset.title||'';cat.textContent=el.dataset.cat||'';desc.textContent=el.dataset.detail||'';overlay.classList.add('open');}
      function close(){overlay.classList.remove('open');}
      document.querySelectorAll('.feature-card,.core-detail,.secondary-card').forEach(el=>el.addEventListener('click',()=>open(el)));
      document.getElementById('detailModalClose').addEventListener('click',close);
      overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
    })();
    </script>
