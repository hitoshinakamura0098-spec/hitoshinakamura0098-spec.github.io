    <div class="modal-overlay" id="detailModal">

    <script>
    (function(){
      const overlay=document.getElementById('detailModal');
      const name=document.getElementById('detailModalName');
      const cat=document.getElementById('detailModalCat');
      const desc=document.getElementById('detailModalDesc');
      if(!overlay)return;
      function open(el){name.textContent=el.dataset.title||'';cat.textContent=el.dataset.cat||'';desc.textContent=el.dataset.detail||'';overlay.classList.add('open');}
      function close(){overlay.classList.remove('open');}
      document.querySelectorAll('.feature-card,.core-detail,.secondary-card').forEach(el=>el.addEventListener('click',()=>open(el)));
      document.getElementById('detailModalClose').addEventListener('click',close);
      overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
    })();
    </script>
