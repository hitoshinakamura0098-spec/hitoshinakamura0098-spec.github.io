  <style>
    .cosmos-glow { opacity: .85; }
    .planet-halo { opacity: .9; }
    .network-signal { opacity: 0; }
    @keyframes planet-float {
      0%, 100% { transform: translate(0, 3px); }
      50% { transform: translate(0, -8px); }
    }
    @keyframes halo-breathe {
      0%, 100% { opacity: .75; }
      50% { opacity: 1; }
    }
    @keyframes cosmos-glow {
      0%, 100% { opacity: .62; }
      50% { opacity: 1; }
    }
    @keyframes signal-left {
      0% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: .8; }
      18.4% { transform: translate(50px, -30px); }
      39.8% { transform: translate(105px, 10px); }
      55% { opacity: .8; }
      60%, 100% { transform: translate(65px, 60px); opacity: 0; }
    }
    @keyframes signal-right {
      0% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: .8; }
      17.7% { transform: translate(42px, -25px); }
      42.3% { transform: translate(97px, 15px); }
      58% { opacity: .8; }
      62%, 100% { transform: translate(60px, 55px); opacity: 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .planet-float { animation: planet-float 18s ease-in-out infinite; }
      .planet-halo { animation: halo-breathe 11s ease-in-out infinite; }
      .cosmos-glow { animation: cosmos-glow 14s ease-in-out infinite; }
      .network-signal-left { animation: signal-left 8s linear -1.2s infinite; }
      .network-signal-right { animation: signal-right 10s linear -4.6s infinite; }
    }
  </style>
